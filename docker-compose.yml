# Local development services only. Ports bind to 127.0.0.1 so they are not reachable from the network.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ticket
      POSTGRES_PASSWORD: ticket
      POSTGRES_DB: ticket
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/dev/init-app-user.sql:/docker-entrypoint-initdb.d/init-app-user.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket -d ticket"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  gotenberg:
    image: gotenberg/gotenberg:8
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      retries: 10

  # Upload scan (NFR-5): clamd with only our YARA rules, run the way deploy/base/clamav.yaml runs it.
  clamav:
    image: clamav/clamav:1.5_base
    user: "10001:10001"
    read_only: true
    tmpfs: [/tmp]
    entrypoint: ["clamd", "--foreground", "--config-file=/etc/ticket-clamav/clamd.conf"]
    volumes:
      - ./deploy/base/clamav:/etc/ticket-clamav:ro
    ports:
      - "127.0.0.1:3310:3310"
    healthcheck:
      test: ["CMD-SHELL", "printf 'zPING\\0' | nc -w 2 127.0.0.1 3310 | grep -q PONG"]
      interval: 5s
      retries: 20

volumes:
  pgdata:
  redisdata:
