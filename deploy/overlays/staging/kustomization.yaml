# Staging: gets every merge to main (Argo CD auto-sync, T3.14). Base sizes.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ticket-staging
resources:
  - ../../base
images:
  # .github/workflows/cd.yml replaces these after each green CI run on main: newName and the signed image's digest
  # (both images from the same commit). Interim registry GHCR; Harbor once T3.12 names the project.
  - name: ticket-app
    newName: ghcr.io/bell77m/case-ticket-sys/ticket-app
    digest: sha256:484fa0027d157fc981ef95c4ab1063374292e2b2e48de309ea44fd1e21bef165
  - name: ticket-migrate
    newName: ghcr.io/bell77m/case-ticket-sys/ticket-migrate
    digest: sha256:885379d2beeb785278374a8024dbeef1ed9a8b888e30bfed8ee35172a89ccca7
configMapGenerator:
  - name: ticket-app-config
    behavior: merge
    literals:
      - BASE_URL=https://tickets-staging.example.internal # placeholder until T3.10 sets the host
