# Staging: gets every merge to main (Argo CD auto-sync, T3.14). Base sizes.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ticket-staging
resources:
  - ../../base
images:
  # CI (T3.15) sets newTag; both images are built from the same commit and share the tag.
  # Placeholder Harbor host until T3.12 names the project.
  - name: ticket-app
    newName: harbor.example.internal/ticket/ticket-app
    newTag: v0.1.0
  - name: ticket-migrate
    newName: harbor.example.internal/ticket/ticket-migrate
    newTag: v0.1.0
configMapGenerator:
  - name: ticket-app-config
    behavior: merge
    literals:
      - BASE_URL=https://tickets-staging.example.internal # placeholder until T3.10 sets the host
