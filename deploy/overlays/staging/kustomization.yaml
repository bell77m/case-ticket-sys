# Staging: gets every merge to main (Argo CD auto-sync, T3.14). Base sizes.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ticket-staging
resources:
  - ../../base
images:
  # .github/workflows/cd.yml replaces these after each green CI run on main: newName and the signed image's digest
  # (all three images from the same commit). Interim registry GHCR; Harbor once T3.12 names the project.
  - name: ticket-app
    newName: ghcr.io/bell77m/case-ticket-sys/ticket-app
    digest: sha256:dd1457d0314d0801b87d8191554e6ba4da09bb7869658210d4988f9aa6fd90f0
  - name: ticket-migrate
    newName: ghcr.io/bell77m/case-ticket-sys/ticket-migrate
    digest: sha256:e1d21329da13c3ea7675aa8733e4c898e63be04df4c84b2d86133cf65b025ddb
  - name: ticket-backup # the tag is replaced by a digest on the first CD run after deploy/backup.Dockerfile landed
    newName: ghcr.io/bell77m/case-ticket-sys/ticket-backup
    newTag: pending-first-cd-run
configMapGenerator:
  - name: ticket-app-config
    behavior: merge
    literals:
      - BASE_URL=https://tickets-staging.example.internal # placeholder until the real host is known (T3.09)
patches:
  # The Ingress (T3.10) answers on the same host. The company networks stay the base placeholder (TEST-NET, which
  # allows nobody) until the real ranges are known: patch Policy company-network like deploy/overlays/local does.
  - target: {kind: Ingress}
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: tickets-staging.example.internal
  - target: {kind: Ingress, name: ticket-app}
    patch: |-
      - op: replace
        path: /spec/tls/0/hosts/0
        value: tickets-staging.example.internal
  # Vault role and paths for this environment (T3.11; the Vault side is set up as in docs/notes/T3.11.md).
  - target: {kind: VaultAuth, name: ticket-app}
    patch: |-
      - op: replace
        path: /spec/kubernetes/role
        value: ticket-staging
  - target: {kind: VaultStaticSecret, name: ticket-app-secrets}
    patch: |-
      - op: replace
        path: /spec/path
        value: ticket/staging/app
  - target: {kind: VaultStaticSecret, name: ticket-app-tls}
    patch: |-
      - op: replace
        path: /spec/path
        value: ticket/staging/tls
