# Local test cluster only (make cluster-deploy), never staging or prod: the base manifests with images built from
# this checkout, third-party images straight from Docker Hub (no Harbor locally), and the Secret generated from a
# gitignored secrets.env with random passwords (make writes it; no secret value is in Git).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ticket-local
resources:
  - namespace.yaml
  - ../../base
images:
  # Built and loaded by `make cluster-images` (k3d image import); both from the same checkout.
  - name: ticket-app
    newTag: local
  - name: ticket-migrate
    newTag: local
  # The base maps these to the Harbor proxy (T3.12); locally they come from Docker Hub.
  - name: harbor.example.internal/dockerhub/library/postgres
    newName: postgres
  - name: harbor.example.internal/dockerhub/library/redis
    newName: redis
  - name: harbor.example.internal/dockerhub/gotenberg/gotenberg
    newName: gotenberg/gotenberg
secretGenerator:
  # Stands in for the VSO-created Secret (T3.11) with the keys listed in deploy/base/kustomization.yaml.
  - name: ticket-app-secrets
    envs: [secrets.env]
configMapGenerator:
  - name: ticket-app-config
    behavior: merge
    literals:
      - BASE_URL=http://localhost:8088
