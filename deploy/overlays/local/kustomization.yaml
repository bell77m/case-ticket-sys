# Local test cluster only (make cluster-deploy), never staging or prod: the base manifests with images built from
# this checkout and third-party images straight from Docker Hub (no Harbor locally). Secrets come from the local
# Vault through VSO like everywhere else (T3.11): deploy/local/vault-setup.sh writes the random values from the
# gitignored secrets.env and tls/ into Vault, so no secret value is in Git or in a manifest.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ticket-local
resources:
  - namespace.yaml
  - ../../base
images:
  # Built and loaded by `make cluster-images` (k3d image import); all from the same checkout.
  - name: ticket-app
    newTag: local
  - name: ticket-migrate
    newTag: local
  - name: ticket-backup
    newTag: local
  # The base maps these to the Harbor proxy (T3.12); locally they come from Docker Hub.
  - name: harbor.example.internal/dockerhub/library/postgres
    newName: postgres
  - name: harbor.example.internal/dockerhub/library/redis
    newName: redis
  - name: harbor.example.internal/dockerhub/gotenberg/gotenberg
    newName: gotenberg/gotenberg
configMapGenerator:
  - name: ticket-app-config
    behavior: merge
    literals:
      # tickets.localtest.me resolves to 127.0.0.1; k3d maps host port 8443 to the ingress (deploy/local/k3d.yaml).
      - BASE_URL=https://tickets.localtest.me:8443
patches:
  # Locally the "company network" is Docker's address pool (the host and test containers). In-cluster pods
  # (10.42.0.0/16) are outside it, which is how the refused-IP check is done (T3.10).
  - target: { kind: Policy, name: company-network }
    patch: |-
      - op: replace
        path: /spec/accessControl/allow
        value: [172.16.0.0/12]
  - target: { kind: Ingress }
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: tickets.localtest.me
  - target: { kind: Ingress, name: ticket-app }
    patch: |-
      - op: replace
        path: /spec/tls/0/hosts/0
        value: tickets.localtest.me
  # Vault role and paths for this environment (deploy/local/vault-setup.sh creates them).
  - target: { kind: VaultAuth, name: ticket-app }
    patch: |-
      - op: replace
        path: /spec/kubernetes/role
        value: ticket-local
  - target: { kind: VaultStaticSecret, name: ticket-app-secrets }
    patch: |-
      - op: replace
        path: /spec/path
        value: ticket/local/app
  - target: { kind: VaultStaticSecret, name: ticket-app-tls }
    patch: |-
      - op: replace
        path: /spec/path
        value: ticket/local/tls
