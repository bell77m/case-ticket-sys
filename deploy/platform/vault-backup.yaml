# Vault's own nightly backup (T3.16 follow-up, NFR-7, NFR-8): a Raft snapshot of all of Vault (secrets, policies,
# auth roles, the backup and Cosign keys) to the vault-backups volume, 14 days kept. Without it a restored cluster
# has no secrets. A snapshot is still sealed by Vault's own keys: it is useless without 3 of the 5 unseal keys.
# Applied with the platform (make cluster-vault-backup), not by Argo CD. Restore steps: docs/RESTORE.md.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-backup
  namespace: vault
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vault-backup
  namespace: vault
  labels:
    app.kubernetes.io/name: vault-backup
spec:
  schedule: "30 2 * * *" # after the app backup at 02:00
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app.kubernetes.io/name: vault-backup
        spec:
          serviceAccountName: vault-backup
          automountServiceAccountToken: false # only the Vault-audience token below
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 100 # the image's vault user
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: snapshot
              image: hashicorp/vault:2.0.4 # same version as the server
              command:
                - /bin/sh
                - -c
                # Kubernetes auth with role vault-backup (policy: read sys/storage/raft/snapshot, nothing else); the
                # token is revoked at the end. The file gets its final name only when complete.
                - |
                  set -eu
                  umask 077
                  VAULT_TOKEN=$(vault write -field=token auth/kubernetes/login role=vault-backup jwt=@/var/run/secrets/vault/token)
                  export VAULT_TOKEN
                  trap 'vault token revoke -self >/dev/null' EXIT # also when the snapshot fails
                  f=/backups/vault-$(date -u +%Y-%m-%dT%H%M%SZ).snap
                  vault operator raft snapshot save "$f.partial"
                  mv "$f.partial" "$f"
                  find /backups -maxdepth 1 -name 'vault-*.snap*' -mtime +"$KEEP_DAYS" -exec rm -f {} \;
                  ls -l "$f"
              env:
                - name: VAULT_ADDR
                  value: https://vault.vault.svc:8200
                - name: VAULT_CACERT
                  value: /vault/tls/ca.crt
                - name: HOME
                  value: /tmp
                - name: KEEP_DAYS
                  value: "14"
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: token
                  mountPath: /var/run/secrets/vault
                  readOnly: true
                - name: tls
                  mountPath: /vault/tls
                  readOnly: true
                - name: backups
                  mountPath: /backups
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: token
              projected:
                sources:
                  - serviceAccountToken:
                      audience: vault
                      expirationSeconds: 600
                      path: token
            - name: tls # only the CA, not Vault's key
              secret:
                secretName: vault-tls
                items:
                  - key: ca.crt
                    path: ca.crt
            - name: backups
              persistentVolumeClaim:
                claimName: vault-backups
            - name: tmp
              emptyDir: {}
---
# On the T3.09 host: the NFS backup share (like ticket-backups), never the disk Vault's Raft data is on.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vault-backups
  namespace: vault
  labels:
    app.kubernetes.io/name: vault-backup
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
