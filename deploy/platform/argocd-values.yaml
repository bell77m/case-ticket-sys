# Argo CD (T3.14, docs/ARCHITECTURE.md), Helm chart argo/argo-cd 10.9.2 (Argo CD v3.5.3). It pulls the manifests
# from Git (deploy/argocd/*.yaml), so CI never holds cluster credentials. Staging syncs by itself; prod only by hand.
# Admin access: `kubectl -n argocd port-forward svc/argocd-server 8080:443`; the first admin password is in Secret
# argocd-initial-admin-secret (change it, then delete that Secret).
dex:
  enabled: false
notifications:
  enabled: false
configs:
  cm:
    # Look at Git every minute (default 3 min), so a digest bump from cd.yml reaches staging quickly.
    timeout.reconciliation: 60s
    # local-path volumes bind only when their first pod starts (WaitForFirstConsumer). Argo CD's default treats a
    # Pending claim as unfinished, so a first sync from scratch waited forever: the uploads claim is in an earlier wave
    # than the app that mounts it, and the backup claim waits for the night's first backup. Pending counts as healthy.
    resource.customizations.health.PersistentVolumeClaim: |
      hs = {status = "Progressing", message = "waiting for the claim"}
      if obj.status ~= nil and obj.status.phase == "Bound" then
        hs.status = "Healthy"; hs.message = "Bound"
      elseif obj.status ~= nil and obj.status.phase == "Pending" then
        hs.status = "Healthy"; hs.message = "Pending: binds when its first pod starts"
      elseif obj.status ~= nil and obj.status.phase == "Lost" then
        hs.status = "Degraded"; hs.message = "Lost"
      end
      return hs
  # Everyone who signs in may look; only role:prod-approver may sync production (the manual release approval), and
  # admin is for setting up only. Approvers are named local accounts, one per person, so Argo CD's log shows who
  # released: their accounts.<name> and "g, <name>, role:prod-approver" lines come from a second values file
  # (locally deploy/local/argocd-approvers.yaml, written by make cluster-argocd-approver NAME=...).
  rbac:
    policy.default: role:readonly
    policy.csv: |
      p, role:prod-approver, applications, get, ticket-prod/*, allow
      p, role:prod-approver, applications, sync, ticket-prod/*, allow
