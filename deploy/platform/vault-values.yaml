# HashiCorp Vault (T3.11, NFR-7), Helm chart hashicorp/vault 0.34.1 (Vault 2.0.4). One Raft node; raise replicas to
# 3 for HA on more nodes. Secrets reach the app through the Vault Secrets Operator (vso-values.yaml), so the agent
# injector is off. Initialised and unsealed by hand: 5 key shares, 3 needed (docs/notes/T3.11.md).
#
# TLS on the listener: tokens and secrets never cross the pod network in clear. Secret "vault-tls" in namespace vault
# holds tls.crt, tls.key and ca.crt, with SANs vault, vault.vault.svc, vault.vault.svc.cluster.local,
# vault-0.vault-internal and 127.0.0.1. It is created before install (Vault cannot serve its own certificate): from the
# company CA on the T3.09 host, from the local CA by `make cluster-vault-tls` on the local cluster.
global:
  tlsDisable: false
injector:
  enabled: false
server:
  extraEnvironmentVars:
    VAULT_CACERT: /vault/userconfig/vault-tls/ca.crt
  volumes:
    - name: vault-tls
      secret:
        secretName: vault-tls
  volumeMounts:
    - name: vault-tls
      mountPath: /vault/userconfig/vault-tls
      readOnly: true
  ha:
    enabled: true
    replicas: 1
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = false
        listener "tcp" {
          address         = "[::]:8200"
          cluster_address = "[::]:8201"
          tls_cert_file   = "/vault/userconfig/vault-tls/tls.crt"
          tls_key_file    = "/vault/userconfig/vault-tls/tls.key"
        }
        storage "raft" {
          path = "/vault/data"
        }
        service_registration "kubernetes" {}
  dataStorage:
    size: 5Gi
  # The file audit device (enabled right after unsealing) writes here; every request is logged with hashed values.
  auditStorage:
    enabled: true
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
ui:
  enabled: false
