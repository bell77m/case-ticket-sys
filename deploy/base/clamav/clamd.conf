# clamd for guest evidence uploads (NFR-5). The app streams each upload here (INSTREAM, CLAMD_ADDR) before saving it.
# Only our YARA rules (ticket-uploads.yar, same folder) and no ClamAV signature database: it starts in seconds and
# needs about 100 MB. Used by docker-compose.yml and deploy/base/clamav.yaml.
Foreground yes
LogTime yes
DatabaseDirectory /etc/ticket-clamav
TCPSocket 3310
TemporaryDirectory /tmp
# Uploads are at most 100 MB (FR-T1): scan every byte.
StreamMaxLength 101M
MaxScanSize 101M
MaxFileSize 101M
