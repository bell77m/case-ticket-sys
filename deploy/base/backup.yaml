# Nightly backup (T3.16, NFR-8): a pg_dump of the database and a tar of the evidence uploads, written to one dated
# folder on the backup volume with a SHA256SUMS file. Folders older than BACKUP_KEEP_DAYS are deleted.
# Restore steps and the restore test: docs/RESTORE.md.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ticket-backup
  labels:
    app.kubernetes.io/name: ticket-backup
spec:
  schedule: "0 2 * * *" # 02:00 in the controller's time zone (UTC on k3s); set spec.timeZone to change it
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: ticket-backup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            # ticket-app's user: it owns the upload files (0640) and folders (0750).
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: postgres:16-alpine # pg_dump from the same major version as the server
              command:
                - /bin/sh
                - -c
                # The dump comes first and the uploads second: the app writes a file before its attachment row, so
                # every row in the dump has its file in the tar. The folder gets its final name only when complete.
                - |
                  set -eu
                  umask 077 # the set holds internal notes, audit IPs and evidence: only this user may read it
                  set_dir=/backups/$(date -u +%Y-%m-%dT%H%M%SZ)
                  mkdir "$set_dir.partial"
                  pg_dump --format=custom --file="$set_dir.partial/ticket.dump"
                  tar -C /data/uploads -cf "$set_dir.partial/uploads.tar" .
                  cd "$set_dir.partial" && sha256sum ticket.dump uploads.tar > SHA256SUMS && cd /
                  mv "$set_dir.partial" "$set_dir"
                  find /backups -mindepth 1 -maxdepth 1 -type d -mtime +"$BACKUP_KEEP_DAYS" -exec rm -rf {} \;
                  ls -l "$set_dir"
              env:
                - name: PGHOST
                  value: postgres
                - name: PGUSER # the owner role: ticket_app cannot read every table
                  value: ticket
                - name: PGDATABASE
                  value: ticket
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: ticket-app-secrets
                      key: POSTGRES_PASSWORD
                - name: BACKUP_KEEP_DAYS
                  value: "14"
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: uploads
                  mountPath: /data/uploads
                  readOnly: true
                - name: backups
                  mountPath: /backups
          volumes:
            - name: uploads
              persistentVolumeClaim:
                claimName: ticket-app-uploads
                readOnly: true
            - name: backups
              persistentVolumeClaim:
                claimName: ticket-backups
---
# The backup target. On the T3.09 host this must be the NFS share (the NFS storage class or a static NFS volume),
# never the disk that holds the database and uploads; the local cluster uses local-path as a stand-in. The files are
# not encrypted: export the share only to the cluster node's IP, with root_squash (docs/RESTORE.md).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ticket-backups
  labels:
    app.kubernetes.io/name: ticket-backup
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 50Gi
