# goose migrations (image: deploy/migrate.Dockerfile), run by Argo CD on each sync before the new app pods.
# Runs as the schema owner "ticket" (MIGRATE_DATABASE_URL); the app itself connects as ticket_app.
# A Sync hook in wave 1, not PreSync: PreSync would run before PostgreSQL exists on a new namespace's first sync.
# Wave 0 (PostgreSQL, Redis, Gotenberg, ConfigMaps) is healthy first; the app Deployment is wave 2 (app.yaml).
apiVersion: batch/v1
kind: Job
metadata:
  name: ticket-migrate
  labels:
    app.kubernetes.io/name: ticket-migrate
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "1"
    # Job specs are immutable: delete the previous run before the next sync creates it again.
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400 # logs stay a day; long after Argo CD has seen the result
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ticket-migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: goose
          image: ticket-migrate
          args: [up]
          env:
            - name: GOOSE_DRIVER
              value: postgres
            - name: GOOSE_MIGRATION_DIR
              value: /migrations
            - name: GOOSE_DBSTRING
              valueFrom:
                secretKeyRef:
                  name: ticket-app-secrets
                  key: MIGRATE_DATABASE_URL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
